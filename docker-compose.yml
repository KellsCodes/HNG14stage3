services:
  nextcloud:
    image: kefaslungu/hng-nextcloud
    restart: always
    volumes:
      - nextcloud_data:/var/www/html
      - HNG-nginx-logs:/var/log/nginx:ro
    environment:
      - TRUSTED_PROXIES=172.16.0.0/12 # Trusts Nginx IP range

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - HNG-nginx-logs:/var/log/nginx
    depends_on:
      - nextcloud

  detector:
    build: ./detector
    restart: always
    network_mode: "host" # Gives the Python daemon access to the host's iptables
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    volumes:
      - HNG-nginx-logs:/var/log/nginx:ro
      - /lib/modules:/lib/modules:ro # Crucial for iptables to talk to kernel
    depends_on:
      - nginx

volumes:
  HNG-nginx-logs:
    name: HNG-nginx-logs
  nextcloud_data:
