events {
    worker_connections 1024;
}

http {
    # Custom JSON log format required by prompt
    log_format hng_json escape=json '{'
        '"source_ip": "$remote_addr",'
        '"timestamp": "$time_iso8601",'
        '"method": "$request_method",'
        '"path": "$request_uri",'
        '"status": "$status",'
        '"response_size": "$body_bytes_sent"'
    '}';

    # Write logs to the shared volume path
    access_log /var/log/nginx/hng-access.log hng_json;

    # Trust real client IP
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # SERVER 1: NEXTCLOUD (Accessible by IP)
    server {
        listen 80;
        server_name 20.86.137.57; 

        location / {
            proxy_pass http://nextcloud:80;

            # Forwarding headers
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # SERVER 2: DASHBOARD (Accessible by Subdomain)
    server {
        listen 80;
        server_name nextcloudmonitor.duckdns.org;

        location / {
            proxy_pass http://localhost:5000; # Routes to Python UI
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

}
